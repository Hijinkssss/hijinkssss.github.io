name: Publish public mod hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public files only
        run: |
          mkdir -p _site/docs
          mkdir -p _site/SRAF-SDC-Audio-Showcase
          cp index.html project.html docs.html changelog.html credits.html 404.html .nojekyll _site/
          cp -R assets _site/assets
          cp docs/CREDITS.md _site/docs/CREDITS.md
          cp SRAF-SDC-Audio-Showcase/index.html _site/SRAF-SDC-Audio-Showcase/index.html
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
